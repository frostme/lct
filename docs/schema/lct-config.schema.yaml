$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/lct-config.schema.yaml"
title: LCT configuration schema
description: >-
  Schema for ~/.config/lct/config.yaml consumed by the lct CLI.
type: object
additionalProperties: false
properties:
  remote:
    type:
      - string
      - "null"
    description: >-
      Git remote URL for the gathered configuration repository. Set to null
      when no remote is configured.
    examples:
      - git@github.com:example/dotfiles.git
      - null
  configs:
    type: array
    description: List of config names managed by lct.
    items:
      type: string
    default: []
    examples:
      - - alacritty
        - nvim
  dotfiles:
    type: array
    description: List of dotfiles managed by lct.
    items:
      type: string
    default: []
    examples:
      - - ~/.zshrc
        - ~/.gitconfig
  other:
    type: array
    description: List of additional files managed by lct.
    items:
      type: string
    default: []
    examples:
      - - ~/work/custom.conf
        - ~/.local/bin/dev-tool
  secrets:
    type: array
    description: List of secret files or directories to encrypt during gather.
    items:
      type: string
    default: []
    examples:
      - - ~/.claude.json
        - ~/.ssh/id_rsa
  encryptAliasFile:
    type: boolean
    description: When true, encrypt ~/.local/share/lct/alias.yaml during gather and restore it on bootstrap.
    default: false
  encryptEnvFile:
    type: boolean
    description: When true, encrypt ~/.local/share/lct/env.yaml during gather and restore it on bootstrap.
    default: false
  plugins:
    type: array
    description: List of lct plugins to install or load.
    items:
      type: string
    default: []
    examples:
      - - gh/owner/example-plugin
  modules:
    type: array
    description: List of module repositories managed by lct.
    items:
      type: string
    default: []
    examples:
      - - github.com/example/lct-module
  projects:
    type: array
    description: List of code projects to clone during bootstrap (OWNER/REPO format).
    items:
      type: string
    default: []
    examples:
      - - frostme/lct
        - frostme/hmgmt-vibe
  packages:
    type: object
    description: >-
      Curated package lists keyed by a package manager registered with LCT.
    propertyNames:
      pattern: "^[a-z0-9][a-z0-9-]*$"
    additionalProperties:
      type: array
      items:
        type: string
        minLength: 1
      uniqueItems: true
    default: {}
    examples:
      - brew:
          - wget
        pnpm:
          - "@dotenvx/dotenvx"
  bootstrap_order:
    type: array
    description: >-
      Order in which bootstrap phases run. Every supported phase must appear
      exactly once.
    items:
      type: string
      enum:
        - packages
        - configs
        - projects
        - plugins
        - modules
        - secrets
    minItems: 6
    maxItems: 6
    uniqueItems: true
    default:
      - packages
      - configs
      - projects
      - plugins
      - modules
      - secrets
  packageManager:
    type: string
    description: >-
      Optional package manager used by install flows (for example, mise).
    examples:
      - mise
required:
  - remote
  - configs
  - dotfiles
  - other
  - secrets
  - plugins
  - modules
examples:
  - remote: null
    configs: []
    dotfiles: []
    other: []
    secrets: []
    encryptAliasFile: false
    encryptEnvFile: false
    plugins: []
    modules: []
    projects: []
    packages: {}
    bootstrap_order:
      - packages
      - configs
      - projects
      - plugins
      - modules
      - secrets
  - remote: git@github.com:example/dotfiles.git
    configs:
      - alacritty
      - nvim
    dotfiles:
      - ~/.zshrc
      - ~/.gitconfig
    other:
      - ~/work/custom.conf
      - ~/.local/bin/dev-tool
    secrets:
      - ~/.claude.json
      - ~/.ssh/id_rsa
    encryptAliasFile: true
    encryptEnvFile: true
    plugins:
      - gh/owner/example-plugin
      - gh/owner/another-plugin
    modules:
      - github.com/example/lct-module
      - github.com/example/lct-theme
    projects:
      - frostme/lct
      - frostme/hmgmt-vibe
    packages:
      brew:
        - wget
      pnpm:
        - "@dotenvx/dotenvx"
    bootstrap_order:
      - packages
      - configs
      - projects
      - plugins
      - modules
      - secrets
    packageManager: mise
